<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Name | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0e0716; --bg2:#1a0b2e; --panel:#1c1030; --red:#d6203f; --red2:#ff5a73;
  --ink:#f4eefb; --muted:#b9a8d3; --line:#3f2a63; --shadow:#000; --pur:#7b3fe4; --pur2:#b18cff;
  --px:'Press Start 2P','Courier New',monospace; --jp:'DotGothic16','MS Gothic',monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0716;--ink:#f4eefb}}
:root[data-theme="dark"]{--bg:#0e0716;--ink:#f4eefb}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;font-size:clamp(16px,1.1vw + 12px,21px);line-height:1.7;overflow-x:hidden;image-rendering:pixelated}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px)}
h1,h2,h3{font-family:var(--px);font-weight:400;line-height:1.5;margin:0;overflow-wrap:anywhere}
a{color:var(--pur2)}
nav{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px;background:linear-gradient(var(--bg),rgba(14,7,22,.92));border-bottom:3px solid var(--pur)}
nav a{font-family:var(--px);font-size:10px;color:var(--ink);text-decoration:none;padding:8px 10px;border:3px solid transparent;transition:.2s}
nav a:hover,nav a.on{border-color:var(--red);background:var(--red);transform:translateY(-2px)}
nav a small{display:block;font-family:var(--jp);font-size:12px;color:var(--muted)}
nav a:hover small,nav a.on small{color:#fff}
.hero{min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden;padding:120px 20px 140px;background:linear-gradient(var(--bg) 0%,var(--bg2) 55%,#4a1238 100%)}
#sun{position:absolute;top:50%;left:50%;width:min(70vw,55vh,520px);aspect-ratio:1;transform:translate(-50%,-55%);animation:bob 6s ease-in-out infinite;filter:drop-shadow(0 0 40px rgba(214,32,63,.4))}
@keyframes bob{50%{transform:translate(-50%,-50%)}}
#torii{position:absolute;bottom:0;left:50%;width:min(90vw,640px);transform:translateX(-50%);opacity:.95}
.hero .in{position:relative;z-index:2;max-width:900px}
.hero h1{font-size:clamp(18px,5vw,48px);text-shadow:3px 3px 0 var(--shadow),0 0 28px rgba(123,63,228,.55);animation:pop .9s steps(6) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.jp{font-family:var(--jp);font-size:clamp(20px,4vw,34px);color:var(--pur2);margin:14px 0;text-shadow:2px 2px 0 #000;animation:pop .9s .2s steps(6) both}
.role{max-width:100%;font-family:var(--px);font-size:clamp(11px,2vw,16px);min-height:2.4em;background:#000a;display:inline-block;padding:10px 14px;border:3px solid var(--pur)}
.role::after{content:"▮";animation:blink 1s steps(1) infinite;color:var(--red2)}
@keyframes blink{50%{opacity:0}}
.tag{max-width:560px;margin:22px auto;background:#0009;padding:8px 12px}
.btn{display:inline-block;max-width:100%;overflow-wrap:anywhere;font-family:var(--px);font-size:12px;text-decoration:none;color:#fff;background:var(--red);padding:14px 18px;border:4px solid #000;box-shadow:6px 6px 0 #000;margin:6px;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 #000}
.btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 #000}
.btn.alt{background:var(--bg);color:var(--ink);border-color:var(--pur)}
section.s{max-width:1000px;margin:0 auto;padding:90px 20px 20px}
.h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:30px;border-bottom:3px solid var(--pur);padding-bottom:12px}
.h h2{font-size:clamp(16px,3vw,24px)}
.h span{font-family:var(--jp);color:var(--pur2);font-size:22px}
.card{background:var(--panel);border:4px solid var(--line);box-shadow:6px 6px 0 #000;padding:20px;transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{transform:translate(-3px,-3px);box-shadow:10px 10px 0 #000;border-color:var(--red)}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:26px}
.stats .card{text-align:center}.stats b{display:block;font-family:var(--px);font-size:22px;color:var(--red2)}
.skill{margin-bottom:18px}.skill div:first-child{display:flex;justify-content:space-between;font-family:var(--px);font-size:11px;margin-bottom:6px}
.bar{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.bar i{height:16px;background:#2a1745;border:2px solid #000}
.bar i.f{background:var(--red);background:color-mix(in srgb,var(--red) calc(var(--n)*11%),var(--pur));animation:fill .3s both;animation-delay:calc(var(--n)*70ms);animation-play-state:paused}
.vis .bar i.f{animation-play-state:running}
@keyframes fill{from{transform:scaleY(0);background:#fff}to{transform:none}}
.quest{position:relative;padding-left:28px;border-left:3px dashed var(--pur);margin-left:8px;margin-bottom:26px}
.quest::before{content:"";position:absolute;left:-12px;top:6px;width:20px;height:20px;background:var(--red2);border:4px solid #000;transform:rotate(45deg)}
.quest h3{font-size:13px}.quest em{font-style:normal;color:var(--muted);font-size:15px}
.quest ul{margin:10px 0 0;padding-left:20px}.quest li::marker{color:var(--red2);content:"▸ "}
.tags span{display:inline-block;font-family:var(--px);font-size:9px;background:var(--pur);padding:5px 7px;margin:8px 6px 0 0;border:2px solid #000}
.proj h3{font-size:13px;margin-bottom:10px}
.rv{opacity:0;transform:translateY(24px);transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1)}
.rv.vis{opacity:1;transform:none}
footer{text-align:center;padding:60px 20px calc(40px + env(safe-area-inset-bottom,0px));color:var(--muted)}
.petal{position:fixed;top:-20px;width:8px;height:8px;background:var(--red2);box-shadow:2px 2px 0 #000;z-index:30;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(360deg)}}
@media (max-width:700px){nav{flex-wrap:nowrap;justify-content:safe center;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}nav::-webkit-scrollbar{display:none}nav a{flex:0 0 auto;font-size:9px;padding:10px;min-height:44px}nav a small{display:none}html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}.hero{padding:100px 16px 120px}.btn{display:block;margin:12px auto;max-width:320px;text-align:center}.card{padding:16px;box-shadow:4px 4px 0 #000}section.s{padding:64px 16px 12px}.stats{grid-template-columns:repeat(3,1fr);gap:10px}.stats .card{padding:12px 6px;font-size:13px}.stats b{font-size:16px}}
@media (max-width:380px){.stats{grid-template-columns:1fr 1fr}.role{font-size:10px}}
@media (hover:none){.card:hover{transform:none;box-shadow:6px 6px 0 #000;border-color:var(--line)}.btn:hover{transform:none;box-shadow:6px 6px 0 #000}nav a:hover{transform:none}}
@media (max-height:500px) and (orientation:landscape){.hero{min-height:auto;padding:90px 20px 110px}#sun{width:45vh}}
@media (min-width:1400px){section.s{max-width:1200px}.hero .in{max-width:1100px}}
@media (min-width:2000px){section.s{max-width:1500px}nav a{font-size:12px}.card{padding:28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.petal{display:none}}
a:focus-visible,.btn:focus-visible{outline:4px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<script>
/* ============================================================
   EDIT YOUR INFORMATION HERE. Everything on the page comes from this object.
   Add or remove items in any list. Skill levels go from 1 to 10.
   ============================================================ */
const CV = {
  name: "YOUR NAME",
  nameJP: "あなたの名前",            // Your name in Japanese, or a short phrase like 「開発者」
  roles: ["Software Developer", "Problem Solver", "Lifelong Learner"],
  tagline: "I build clean, reliable things for the web.",
  about: [
    "Write two or three sentences about who you are and what you do.",
    "Mention what drives you, the kind of work you want, and what makes you different."
  ],
  stats: [ { value: "3+", label: "Years learning" }, { value: "12", label: "Projects built" }, { value: "5", label: "Tools mastered" } ],
  skills: [
    { name: "JavaScript", level: 8 }, { name: "Python", level: 7 },
    { name: "SQL", level: 6 }, { name: "HTML & CSS", level: 8 }, { name: "Git", level: 7 }
  ],
  experience: [
    { role: "Job Title", company: "Company Name", period: "2024 – Present",
      points: ["What you achieved here, with a number if you can.", "Another thing you owned or improved."] },
    { role: "Earlier Role", company: "Another Company", period: "2022 – 2024",
      points: ["A key responsibility.", "A result you are proud of."] }
  ],
  projects: [
    { title: "Project One", desc: "One sentence on what it does and why it matters.", tags: ["JS", "API"], link: "https://example.com" },
    { title: "Project Two", desc: "Another short description of what you built.", tags: ["Python", "Data"], link: "https://example.com" },
    { title: "Project Three", desc: "A third project. Delete this block if you only have two.", tags: ["SQL"], link: "" }
  ],
  education: [
    { degree: "Your Degree", school: "Your Institution", period: "2021 – 2025" }
  ],
  contact: {
    email: "you@example.com",
    links: [ { label: "GitHub", url: "https://github.com/" }, { label: "LinkedIn", url: "https://linkedin.com/" } ]
  },
  // Menu and section titles: [English, Japanese]
  sections: { about: ["About", "自己紹介"], skills: ["Skills", "技能"], experience: ["Experience", "経験"],
              projects: ["Projects", "作品"], education: ["Education", "学歴"], contact: ["Contact", "連絡"] },
  footer: "Made with pixels and sakura. © " + new Date().getFullYear()
};
</script>

<nav id="nav"></nav>
<header class="hero" id="top">
  <svg id="sun" viewBox="0 0 16 16" shape-rendering="crispEdges"></svg>
  <svg id="torii" viewBox="0 0 32 24" shape-rendering="crispEdges" fill="#12072a">
    <rect x="0" y="1" width="3" height="2"/><rect x="2" y="2" width="28" height="3"/><rect x="29" y="1" width="3" height="2"/>
    <rect x="4" y="5" width="24" height="2" fill="#7b3fe4"/><rect x="5" y="9" width="22" height="2"/>
    <rect x="9" y="5" width="3" height="19"/><rect x="20" y="5" width="3" height="19"/><rect x="15" y="7" width="2" height="2"/>
  </svg>
  <div class="in">
    <h1 id="name"></h1><div class="jp" id="nameJP"></div>
    <div class="role" id="role"></div>
    <p class="tag" id="tagline"></p>
    <a class="btn" href="#projects" id="b1"></a><a class="btn alt" href="#contact" id="b2"></a>
  </div>
</header>
<main id="main"></main>
<footer id="foot"></footer>

<script>
const $=s=>document.querySelector(s), S=CV.sections;
document.title=CV.name+" | Portfolio";
$('#name').textContent=CV.name; $('#nameJP').textContent=CV.nameJP; $('#tagline').textContent=CV.tagline;
$('#b1').textContent=S.projects[0]; $('#b2').textContent=S.contact[0]; $('#foot').textContent=CV.footer;

// Pixel sun
(function(){let h='';for(let y=0;y<16;y++)for(let x=0;x<16;x++){const d=Math.hypot(x-7.5,y-7.5);
 if(d<7.6)h+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${d<4?'#ff5a73':d<6?'#d6203f':'#7a2a9a'}"/>`}$('#sun').innerHTML=h})();

const card=(c,x)=>`<div class="card rv ${c||''}">${x}</div>`;
const sec=(id,body)=>`<section class="s" id="${id}"><div class="h rv"><h2>${S[id][0]}</h2><span>${S[id][1]}</span></div>${body}</section>`;
$('#main').innerHTML=
 sec('about',`<div class="rv">${CV.about.map(p=>`<p>${p}</p>`).join('')}</div><div class="stats">${CV.stats.map(s=>card('',`<b>${s.value}</b>${s.label}`)).join('')}</div>`)+
 sec('skills',`<div class="card rv">${CV.skills.map(k=>`<div class="skill"><div><span>${k.name}</span><span>${k.level}/10</span></div><div class="bar">${Array.from({length:10},(_,i)=>`<i class="${i<k.level?'f':''}" style="--n:${i}"></i>`).join('')}</div></div>`).join('')}</div>`)+
 sec('experience',CV.experience.map(e=>`<div class="quest rv"><h3>${e.role}</h3><em>${e.company} | ${e.period}</em><ul>${e.points.map(p=>`<li>${p}</li>`).join('')}</ul></div>`).join(''))+
 sec('projects',`<div class="grid">${CV.projects.map(p=>card('proj',`<h3>${p.title}</h3><p>${p.desc}</p><div class="tags">${p.tags.map(t=>`<span>${t}</span>`).join('')}</div>${p.link?`<p><a href="${p.link}" target="_blank" rel="noopener">View project</a></p>`:''}`)).join('')}</div>`)+
 sec('education',`<div class="grid">${CV.education.map(e=>card('',`<h3 style="font-size:13px">${e.degree}</h3><p>${e.school}<br><em style="color:var(--muted)">${e.period}</em></p>`)).join('')}</div>`)+
 sec('contact',`<div class="rv"><a class="btn" href="mailto:${CV.contact.email}">${CV.contact.email}</a>${CV.contact.links.map(l=>`<a class="btn alt" href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join('')}</div>`);

$('#nav').innerHTML=Object.keys(S).map(k=>`<a href="#${k}" data-k="${k}">${S[k][0]}<small>${S[k][1]}</small></a>`).join('');

// Typewriter
(function(){const el=$('#role');let r=0,c=0,del=false;
 (function t(){const w=CV.roles[r];el.firstChild&&el.removeChild(el.firstChild);
  el.insertBefore(document.createTextNode(w.slice(0,c)),el.firstChild);
  if(!del&&c===w.length){del=true;return setTimeout(t,1400)}
  if(del&&c===0){del=false;r=(r+1)%CV.roles.length}
  c+=del?-1:1;setTimeout(t,del?35:80)})()})();

// Scroll reveal and active nav
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.rv').forEach((e,i)=>{e.style.transitionDelay=(i%4)*60+'ms';io.observe(e)});
const so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===e.target.id))}),{rootMargin:'-40% 0px -55% 0px'});
document.querySelectorAll('section.s').forEach(s=>so.observe(s));

// Falling sakura pixels
const N=innerWidth<700?8:16;for(let i=0;i<N;i++){const p=document.createElement('div');p.className='petal';
 p.style.left=Math.random()*100+'vw';p.style.setProperty('--dx',(Math.random()*160-80)+'px');
 p.style.animationDuration=8+Math.random()*10+'s';p.style.animationDelay=-Math.random()*14+'s';
 p.style.opacity=.35+Math.random()*.4;if(Math.random()<.35)p.style.background='#b18cff';document.body.appendChild(p)}
</script>
</body>
</html>
